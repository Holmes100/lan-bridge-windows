[package]
name = "lan-bridge-windows"
version = "0.1.0"
description = "LAN Bridge (Windows) — 把 WSL2 里的 Claude Science 转发到局域网"
edition = "2021"

[lib]
name = "lan_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
